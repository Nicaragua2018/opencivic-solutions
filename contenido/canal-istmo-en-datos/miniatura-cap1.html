<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800;900&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
#t{width:1280px;height:720px;position:relative;overflow:hidden;font-family:Inter,sans-serif;background:linear-gradient(135deg,#0d2a3a,#08161f 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px);background-size:100% 60px}
.txt{position:absolute;left:54px;top:70px;font-family:Anton,Impact,sans-serif;color:#fff;line-height:1.02;text-shadow:0 8px 0 rgba(0,0,0,.5)}
.txt .a{font-size:118px}.txt .b{font-size:168px;color:#3fd0b0}
.chart{position:absolute;left:640px;right:60px;bottom:90px;height:520px;display:flex;align-items:flex-end;gap:22px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;background:#4b6b7d;border-radius:10px 10px 0 0}
.bar b{font:900 26px Inter;color:#cfe3ec;margin-top:12px}
.bar.hl i{background:#ffcc33;box-shadow:0 0 40px #ffcc3366}
.bar.hl b{color:#ffcc33}
.q{position:absolute;font-family:Anton,Impact,sans-serif;font-size:150px;color:#ffcc33;text-shadow:0 8px 0 rgba(0,0,0,.5)}
.brand{position:absolute;left:58px;bottom:36px;color:#cfe3ecbb;font:800 22px Inter;letter-spacing:3px}
.brand span{color:#3fd0b0}
</style></head><body>
<div id="t"><div class="grid"></div>
 <div class="txt"><div class="a">¿QUIÉN</div><div class="a">DEPENDE</div><div class="b">MÁS?</div></div>
 <div class="chart">
  <div class="bar"><i style="height:30%"></i><b>RD</b></div>
  <div class="bar"><i style="height:66%"></i><b>GT</b></div>
  <div class="bar"><i style="height:86%"></i><b>SV</b></div>
  <div class="bar"><i style="height:88%"></i><b>NI</b></div>
  <div class="bar hl"><i style="height:96%"></i><b>?</b></div>
 </div>
 <div class="brand"><span>ISTMO</span> EN DATOS · REMESAS 2025</div>
</div></body></html>

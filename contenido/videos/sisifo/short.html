<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#121212;overflow:hidden;font-family:Inter,sans-serif}
#c{position:absolute;inset:0}
.cap{position:absolute;left:70px;right:70px;top:260px;color:#fff;font-family:Anton,Impact,sans-serif;font-size:104px;line-height:1.08;text-shadow:0 6px 0 rgba(0,0,0,.6);opacity:0;transition:opacity .5s}
.cap em{font-style:normal;color:#FFB800}
.cap.on{opacity:1}
.brand{position:absolute;left:70px;top:150px;color:#FFB800;font:800 30px Inter;letter-spacing:4px}
.src{position:absolute;left:70px;bottom:120px;color:#ffffff88;font:600 26px Inter;opacity:0;transition:opacity .5s}
.src.on{opacity:1}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="brand">LA COLMENA · PARÁBOLAS</div>
<div class="cap" id="cap"></div>
<div class="src" id="src">Fuentes: Apolodoro, Biblioteca 1.9.3 · Homero, Odisea XI</div>
<script>
const caps=[
 [0.3,4.2,"Los dioses no castigaron a Sísifo <em>por pecar.</em>"],
 [4.4,8.2,"Lo castigaron por <em>contar la verdad.</em>"],
 [8.4,14.0,"Zeus se llevó en secreto a Egina, la hija del dios del río <em>Asopo.</em>"],
 [14.2,18.6,"Sísifo se lo contó <em>a su padre.</em>"],
 [18.8,25.0,"Su castigo: una roca que <em>siempre vuelve a caer.</em>"],
 [25.2,31.0,"Al que desafía al poder no siempre se le mata. <em>Se le condena a agotarse.</em>"],
 [31.2,37.4,"¿Y si Sísifo <em>no estuviera solo?</em>"],
 [37.6,43.0,"La historia completa, <em>en el canal.</em> 🐝"]];
const cap=document.getElementById('cap'), src=document.getElementById('src'), cv=document.getElementById('c'), x=cv.getContext('2d');
const A={x:60,y:1700}, B={x:1020,y:820}, R=105;
const bees=[...Array(40)].map((_,i)=>({o:Math.random()*Math.PI*2, d:120+Math.random()*120, s:.6+Math.random()}));
function lerp(a,b,k){return a+(b-a)*k}
function ease(k){return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2}
function pAt(t){ // posición de la roca a lo largo de la ladera (0..1)
 if(t<18.8) return .08+.01*Math.sin(t*2);
 if(t<23.2) return lerp(.08,.86,ease((t-18.8)/4.4));
 if(t<25.0) return lerp(.86,.08,Math.pow((t-23.2)/1.8,2));
 if(t<31.0) return lerp(.08,.45,ease((t-25)/6))*(1-.0)+.0;
 if(t<31.6) return lerp(.45,.40,(t-31)/.6);
 if(t<37.0) return lerp(.40,.93,ease((t-31.6)/5.4));
 return .93;
}
let t0=null;
function frame(now){
 if(t0===null)t0=now; const t=(now-t0)/1000;
 // textos
 const c=caps.find(c=>t>=c[0]&&t<c[1]); if(c){ if(cap.dataset.k!=c[0]){cap.innerHTML=c[2];cap.dataset.k=c[0];} cap.classList.add('on'); } else cap.classList.remove('on');
 src.classList.toggle('on', t>4 && t<18.6 || t>37.6);
 // fondo
 x.clearRect(0,0,1080,1920);
 const g=x.createLinearGradient(0,600,0,1920); g.addColorStop(0,'#1b2433'); g.addColorStop(1,'#0b0f19'); x.fillStyle=g; x.fillRect(0,0,1080,1920);
 // montaña
 x.fillStyle='#2C4A70'; x.beginPath(); x.moveTo(0,1920); x.lineTo(A.x-60,A.y+40); x.lineTo(B.x,B.y-20); x.lineTo(1080,B.y-20); x.lineTo(1080,1920); x.closePath(); x.fill();
 x.strokeStyle='#FFB80066'; x.lineWidth=6; x.beginPath(); x.moveTo(A.x-60,A.y+40); x.lineTo(B.x,B.y-20); x.stroke();
 // cima
 x.fillStyle='#FFB800'; x.beginPath(); x.arc(B.x-30,B.y-60,14,0,7); x.fill();
 // roca
 const p=pAt(t), cx=lerp(A.x,B.x,p), cy=lerp(A.y,B.y,p)-R+10;
 x.save(); x.translate(cx,cy); x.rotate(p*14);
 const rg=x.createRadialGradient(-30,-30,20,0,0,R); rg.addColorStop(0,'#8a8f99'); rg.addColorStop(1,'#3d424c'); x.fillStyle=rg;
 x.beginPath(); for(let i=0;i<10;i++){const a=i/10*Math.PI*2, r=R*(.9+.1*Math.sin(i*3)); x.lineTo(Math.cos(a)*r,Math.sin(a)*r);} x.closePath(); x.fill();
 x.strokeStyle='#00000055'; x.lineWidth=5; x.beginPath(); x.moveTo(-40,-10); x.lineTo(20,30); x.stroke(); x.restore();
 // abejas (enjambre) a partir de 31 s
 if(t>31){ const k=Math.min(1,(t-31)/1.5); bees.forEach((b,i)=>{ if(i/bees.length>k) return;
   const a=b.o+t*b.s*2, bx=cx-Math.cos(.7)*b.d*.9+Math.cos(a)*30-60, by=cy+Math.sin(a)*40+60-b.d*.3;
   x.fillStyle='#FFB800'; x.beginPath(); x.ellipse(bx,by,11,8,0,0,7); x.fill();
   x.fillStyle='#2C4A70'; x.fillRect(bx-3,by-8,4,16);
   x.fillStyle='#cfe9ffaa'; x.beginPath(); x.ellipse(bx-2,by-12,7,5,.5,0,7); x.fill(); }); }
 // Sísifo solo (figura simple) antes de 31 s
 if(t<31){ const fx=cx-R*1.25, fy=cy+R*.55; x.strokeStyle='#e8e1d0'; x.lineWidth=12; x.lineCap='round';
   x.beginPath(); x.arc(fx-10,fy-95,22,0,7); x.stroke(); x.beginPath(); x.moveTo(fx-10,fy-70); x.lineTo(fx+10,fy); x.lineTo(fx-30,fy+70); x.moveTo(fx+10,fy); x.lineTo(fx+30,fy+70); x.moveTo(fx-5,fy-55); x.lineTo(fx+55,fy-40); x.stroke(); }
 requestAnimationFrame(frame);
}
document.fonts.ready.then(()=>{ window.__go=true; requestAnimationFrame(frame); });
</script></body></html>

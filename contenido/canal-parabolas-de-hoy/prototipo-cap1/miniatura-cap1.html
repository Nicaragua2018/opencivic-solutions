<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;900&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
#t{width:1280px;height:720px;position:relative;overflow:hidden;font-family:Inter,sans-serif;
  background:radial-gradient(circle at 72% 45%,#5a3a12 0%,#2a1a0b 45%,#0e0906 100%)}
.glow{position:absolute;right:120px;top:40px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#f3b25a55,transparent 65%)}
.txt{position:absolute;left:56px;top:128px;font-family:Anton,Impact,sans-serif;font-size:232px;line-height:1.1;color:#ffd27a;
  text-shadow:0 10px 0 rgba(0,0,0,.55),0 0 50px rgba(0,0,0,.7)}
.tag{position:absolute;left:58px;top:56px;background:#ffffffe6;color:#2a1a0b;font:900 26px Inter;padding:8px 16px;border-radius:8px;letter-spacing:1px}
.brand{position:absolute;left:60px;bottom:34px;color:#f6e6c8cc;font:700 22px Inter;letter-spacing:3px}
.phone{position:absolute;right:300px;top:70px;width:330px;height:600px;border-radius:46px;background:#0b0b0b;border:9px solid #2b2b2b;transform:rotate(-6deg);box-shadow:0 30px 70px rgba(0,0,0,.7)}
.screen{position:absolute;inset:16px;border-radius:32px;background:#efe7dc;overflow:hidden}
.top{background:#0b6e4f;color:#fff;padding:52px 18px 14px;font:700 22px Inter}
.top small{display:block;font:500 15px Inter;opacity:.85}
.msg{margin:22px 16px;background:#fff;border-radius:16px;padding:16px;font:500 24px/1.32 Inter;color:#1c1c1c;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:100px;height:26px;background:#0b0b0b;border-radius:20px}
.face{position:absolute;right:40px;bottom:-30px;font-size:330px;filter:drop-shadow(0 16px 26px rgba(0,0,0,.7))}
</style></head><body>
<div id="t"><div class="glow"></div>
 <div class="tag">CAP. 1 · LA FAMILIA DE DOÑA CARMEN</div>
 <div class="txt">¿ES<br>ÉL?</div>
 <div class="phone"><div class="screen"><div class="top">Daniel ❤️<small>número nuevo</small></div>
  <div class="msg">Hola mamá. Soy yo, Daniel. Cambié de número. Perdóname por todo.</div></div><div class="notch"></div></div>
 <div class="face">🥹</div>
 <div class="brand">PARÁBOLAS DE HOY</div>
</div></body></html>

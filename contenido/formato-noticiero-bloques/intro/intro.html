<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;900&display=block" rel="stylesheet">
<style>*{margin:0;padding:0}html,body{background:#0b0f19;overflow:hidden}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script>
const q=new URLSearchParams(location.search), mode=q.get('m')||'intro';
const W=mode==='vertical'?1080:1920, H=mode==='vertical'?1920:1080, DUR=mode==='stinger'?2.2:10;
const cv=document.getElementById('c'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
const GOLD='#FFB800', NAVY='#2C4A70', RED='#d62828', BLUE='#2c6fbf';
const ease=k=>k<0?0:k>1?1:1-Math.pow(1-k,3), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function cube(cx,cy,s,col){ x.fillStyle=col; x.fillRect(cx,cy,s,s); x.fillStyle='rgba(255,255,255,.18)'; x.fillRect(cx,cy,s,s*.18); x.fillStyle='rgba(0,0,0,.25)'; x.fillRect(cx,cy+s*.82,s,s*.18); }
function avatar(px,py,sc,shirt,mic){ // avatar estilo bloque (genérico, no de Roblox)
 x.save(); x.translate(px,py); x.scale(sc,sc);
 x.fillStyle='#f2c68b'; x.fillRect(-40,-230,80,80); x.fillStyle='#222'; x.fillRect(-20,-200,10,10); x.fillRect(10,-200,10,10); x.fillRect(-12,-176,24,5);
 x.fillStyle=shirt; x.fillRect(-55,-145,110,120); x.fillStyle='#f2c68b'; x.fillRect(-85,-145,28,100); x.fillRect(57,-145,28,100);
 x.fillStyle='#1f2a3a'; x.fillRect(-55,-25,52,110); x.fillRect(3,-25,52,110);
 if(mic){ x.fillStyle='#111'; x.fillRect(80,-120,12,60); x.fillStyle='#555'; x.beginPath(); x.arc(86,-128,16,0,7); x.fill(); }
 x.restore(); }
const word1='NOTICIERO', word2='EN BLOQUES';
function drawLogo(t, cx, cy, s){ // letras que caen como bloques
 x.textAlign='center'; x.textBaseline='middle';
 [word1,word2].forEach((w,row)=>{ const fs=row?s*.62:s, y=cy+(row?s*.85:0);
  x.font=`${fs}px Anton, Impact`; const tw=x.measureText(w).width; let ox=cx-tw/2;
  [...w].forEach((ch,i)=>{ const cw=x.measureText(ch).width, d=(row*9+i)*0.045, k=ease((t-d)/0.45);
    const yy=y-(1-k)*H*0.6; x.globalAlpha=clamp(k*1.5,0,1);
    x.fillStyle=row?GOLD:'#fff'; x.fillText(ch,ox+cw/2,yy); ox+=cw; }); x.globalAlpha=1; });
}
function bg(t){ const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#13213a'); g.addColorStop(1,'#0b0f19'); x.fillStyle=g; x.fillRect(0,0,W,H);
 x.globalAlpha=.08; const s=60; for(let i=0;i<W/s;i++) for(let j=0;j<H/s;j++) if((i*7+j*13+Math.floor(t*4))%11===0) cube(i*s,j*s,s-4,GOLD); x.globalAlpha=1; }
function intro(t){
 bg(t);
 const L=mode==='vertical';
 // 0–3.2 s: logo que se arma con bloques
 if(t<3.4){ drawLogo(t, W/2, H*(L?.42:.42), L?190:220); }
 // 3.2–7.2 s: dos personajes: estudio y corresponsal
 if(t>=3.2&&t<7.6){ const k=ease((t-3.2)/.6);
   const desk=L?{x:W/2,y:H*.48}:{x:W*.3,y:H*.78}, rep=L?{x:W/2,y:H*.93}:{x:W*.72,y:H*.78};
   // estudio
   x.fillStyle='#22324a'; L?x.fillRect(0,H*.08,W,H*.44):x.fillRect(0,0,W/2,H);
   x.fillStyle='#3a4a62'; L?x.fillRect(W*.2,H*.42,W*.6,H*.1):x.fillRect(W*.1,H*.74,W*.4,H*.26);
   avatar(desk.x+(1-k)*(L?-W:-W*.6),desk.y-(L?40:0),L?1.3:1.5,RED,false);
   // lugar icónico (genérico: plaza con bandera)
   x.fillStyle='#4f6377'; L?x.fillRect(0,H*.52,W,H*.48):x.fillRect(W/2,0,W/2,H);
   x.fillStyle='#8aa0b4'; const bx=L?W*.12:W*.56, by=L?H*.6:H*.25; x.fillRect(bx,by,L?W*.5:W*.3,L?H*.18:H*.4);
   for(let i=0;i<6;i++){x.fillStyle='#6d8296'; x.fillRect(bx+20+i*(L?85:95),by+40,30,(L?H*.18:H*.4)-40);}
   x.fillStyle='#ddd'; x.fillRect(L?W*.8:W*.92,L?H*.56:H*.12,8,L?H*.3:H*.6); x.fillStyle='#4a86d6'; x.fillRect(L?W*.8+8:W*.92+8,L?H*.56:H*.12,90,20); x.fillStyle='#fff'; x.fillRect(L?W*.8+8:W*.92+8,L?H*.56+20:H*.12+20,90,20); x.fillStyle='#4a86d6'; x.fillRect(L?W*.8+8:W*.92+8,L?H*.56+40:H*.12+40,90,20);
   avatar(rep.x+(1-k)*(L?W:W*.6),rep.y-(L?40:0),L?1.3:1.5,BLUE,true);
   // rótulos
   const k2=ease((t-4.0)/.4); x.globalAlpha=k2;
   x.fillStyle=RED; x.fillRect(L?40:W/2+40,L?H*.54:40,L?470:520,56); x.fillStyle='#fff'; x.font='900 34px Inter'; x.textAlign='left'; x.textBaseline='middle'; x.fillText('● EN DIRECTO',L?62:W/2+62,(L?H*.54:40)+28);
   x.fillStyle=RED; x.fillRect(L?40:40,L?H*.1:40,L?380:420,56); x.fillStyle='#fff'; x.fillText('ESTUDIO',L?62:62,(L?H*.1:40)+28); x.globalAlpha=1;
 }
 // 7.2–10 s: lema y logo final
 if(t>=7.4){ const k=ease((t-7.4)/.5); x.globalAlpha=k; drawLogo(99,W/2,H*.4,L?170:190); x.globalAlpha=1;
   const k2=ease((t-8.0)/.5); x.globalAlpha=k2; x.fillStyle=GOLD; x.font=`900 ${L?40:46}px Inter`; x.textAlign='center';
   x.fillText(L?'HISTORIA · GEOPOLÍTICA':'HISTORIA · GEOPOLÍTICA · FILOSOFÍA',W/2,H*(L?.6:.68)); if(L) x.fillText('FILOSOFÍA',W/2,H*.64); x.globalAlpha=1;
   const k3=ease((t-8.6)/.4); x.fillStyle=RED; x.fillRect(0,H-(L?260:150)*k3,W,(L?110:90)*k3); x.fillStyle='#fff'; x.font=`900 ${L?42:44}px Inter`; x.textAlign='left'; if(k3>.9) x.fillText('ÚLTIMA HORA  |  Tu titular aquí',40,H-(L?205:105)); }
}
function stinger(t){ // cortinilla: bloques que barren la pantalla
 x.fillStyle='#0b0f19'; x.fillRect(0,0,W,H); const s=120;
 for(let i=0;i<W/s+1;i++) for(let j=0;j<H/s+1;j++){ const d=(i+j)*0.035, k=ease((t-d)/.35), out=ease((t-1.1-d)/.35);
   const sz=s*(k-out); if(sz>1) cube(i*s+(s-sz)/2,j*s+(s-sz)/2,sz,(i+j)%3?NAVY:GOLD); }
 const k=ease((t-.7)/.3)-ease((t-1.5)/.3); x.globalAlpha=clamp(k,0,1); drawLogo(99,W/2,H*.45,150); x.globalAlpha=1;
}
let t0=null; function frame(now){ if(t0===null)t0=now; const t=(now-t0)/1000; (mode==='stinger'?stinger:intro)(t); if(t<DUR+.5) requestAnimationFrame(frame); }
document.fonts.ready.then(()=>{ window.__go=true; requestAnimationFrame(frame); });
</script></body></html>
